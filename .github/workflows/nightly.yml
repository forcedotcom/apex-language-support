name: Nightly Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: false
        default: 'main'
        type: string
      dry-run:
        description: 'Run in dry-run mode (no actual publishing)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.event.inputs.branch || 'main' }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  nightly-release:
    uses: ./.github/workflows/nightly-publish-extensions.yml
    with:
      branch: ${{ github.event.inputs.branch || 'main' }}
      # Use 'changed' to automatically detect extensions with changes since last release
      # This repo only has 1 extension, but using 'changed' prevents unnecessary nightly releases
      extensions: 'changed'
      registries: 'all'
      pre-release: 'true'
      version-bump: 'auto'
      exclude-web-vsix: 'false'
      package-manager: 'pnpm'
      package-manager-version: '12.10.1'
      cache-dependency-path: 'pnpm-lock.yaml'
      install-command: 'pnpm install --frozen-lockfile'
      package-command: 'pnpm run package:packages'
      prerelease-package-command: 'pnpm run package:packages:prerelease'
      dry-run: ${{ github.event.inputs.dry-run == true || github.event.inputs.dry-run == 'true' }}
    secrets: inherit
