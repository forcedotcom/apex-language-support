name: Setup Node Cache Probe

# Temporary diagnostic workflow for W-24887043. The push trigger is restricted to
# this branch so the experiment can run before the workflow reaches the default branch.
on:
  push:
    branches: [test/W-24887043-setup-node-cache-probe]
  workflow_dispatch:
    inputs:
      cache-buster:
        description: Unique value for this probe run
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  probe:
    name: ${{ matrix.package-manager }} (${{ matrix.install-global-plugin && 'npm-install' || 'no-install' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, yarn, pnpm]
        install-global-plugin: [false, true]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: '12.11.2'

      - name: Create unique cache dependency file
        env:
          CACHE_BUSTER: ${{ inputs.cache-buster || github.run_id }}
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
          INSTALL_GLOBAL_PLUGIN: ${{ matrix.install-global-plugin }}
        run: |
          mkdir -p .cache-probe
          printf '%s\n' "$CACHE_BUSTER-$PACKAGE_MANAGER-$INSTALL_GLOBAL_PLUGIN" > ".cache-probe/$PACKAGE_MANAGER-$INSTALL_GLOBAL_PLUGIN.lock"
          if [ "$PACKAGE_MANAGER" = yarn ]; then
            printf '%s\n' '{"packageManager":"yarn@1.22.22"}' > .cache-probe/package.json
          fi

      - name: Report cache locations before setup-node
        shell: bash
        run: |
          for cache_path in \
            "$HOME/.npm" \
            "$HOME/.cache/yarn/v6" \
            "$PNPM_HOME/store/v11"; do
            if [ -d "$cache_path" ]; then
              printf 'exists: %s\n' "$cache_path"
            else
              printf 'absent: %s\n' "$cache_path"
            fi
          done

      - name: Set up Node with package-manager cache
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ matrix.package-manager }}
          cache-dependency-path: .cache-probe/${{ matrix.package-manager }}-${{ matrix.install-global-plugin }}.lock

      - name: Install release-management plugin globally with npm
        if: matrix.install-global-plugin
        run: npm install -g @salesforce/plugin-release-management --omit=dev

      - name: Report package-manager cache paths
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm) cache_path="$(npm config get cache)" ;;
            yarn) cache_path="$(yarn --cwd .cache-probe cache dir)" ;;
            pnpm) cache_path="$(pnpm store path --silent)" ;;
          esac

          if [ -d "$cache_path" ]; then
            printf 'exists: %s\n' "$cache_path"
          else
            printf 'absent: %s\n' "$cache_path"
          fi
