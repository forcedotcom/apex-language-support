name: Publish Open VSX (Trusted)
run-name: "Open VSX: ${{ inputs.release-tag }}"

# The actual `ovsx publish` for every channel (prerelease, stable, and manual-publish's
# version-tag path) lives here. Open VSX's trusted-publisher match keys off the OIDC token's
# workflow_ref claim -- the top-level initiating workflow, not job_workflow_ref -- and allows
# exactly one trusted-publisher registration per extension (hard server-side check -- see
# TrustedPublishingService.registerTrustedPublisher in eclipse-openvsx/openvsx). So
# promote-prerelease.yml, promote-stable.yml, and manual-publish.yml each dispatch this file via
# `gh workflow run` (a new, independent run, not a `uses:` call) instead of publishing Open VSX
# themselves, giving every publish for this extension the same workflow_ref. Register the Open
# VSX trusted publisher against *this* file.
#
# No isHotfix/gate-check job here: every caller already tests the commit before dispatching.
# manual-publish.yml's bypass path (source-run-id) can't reach here at all -- no GitHub Release
# exists for a branch-CI-run artifact for this file's tag-based publish to target.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag to publish (e.g. apex-language-server-extension-v0.5.3-nightly.20260301 or apex-language-server-extension-v0.6.0)'
        required: true
        type: string
      dry-run:
        description: 'Download and inspect VSIXs without publishing'
        type: boolean
        default: false

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: salesforcecli/github-workflows/.github/workflows/openvsx-publish-release-vsix.yml@main
    with:
      release-tag: ${{ inputs.release-tag }}
      vsix-name-pattern: 'apex-language-server-extension-*.vsix'
      exclude-web-vsix: 'true'
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit
