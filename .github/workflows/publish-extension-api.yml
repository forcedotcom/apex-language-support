name: Publish Extension API

# Publish the API only after its matching VSIX has reached the Marketplace. The
# prepared API tag records the release source and materialized npm version used
# by the shared npm publisher.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Required for publish/retry. Existing Apex extension release tag; the API version is derived from this tag. Do not set version. Example: apex-language-server-extension-v0.11.70-nightly.20261105'
        required: false
        type: string
      source_ref:
        description: 'Git ref to validate in dry-run mode; defaults to the selected workflow ref'
        required: false
        type: string
      version:
        description: 'Dry-run only. Prospective API version when no release_tag is supplied. Do not set for publish/retry.'
        required: false
        type: string
      npm_dist_tag:
        description: 'npm dist-tag to apply during publication'
        required: false
        type: string
      dry_run:
        description: 'Build, test, lint, and validate the prospective API version without creating a tag or publishing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      api-tag: ${{ steps.release.outputs.api-tag }}
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    env:
      PACKAGE_NAME: '@salesforce/apex-language-server-extension-api'
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_REF: ${{ inputs.source_ref || github.ref }}
      VERSION_INPUT: ${{ inputs.version }}
      NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Checkout extension release tag
        if: env.DRY_RUN != 'true'
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Checkout dry-run source
        if: env.DRY_RUN == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare API release source
        id: release
        run: |
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            printf '%s' "${value%"${value##*[![:space:]]}"}"
          }
          RELEASE_TAG=$(trim "$RELEASE_TAG")
          VERSION_INPUT=$(trim "$VERSION_INPUT")
          NPM_DIST_TAG=$(trim "$NPM_DIST_TAG")
          VERSION="${RELEASE_TAG#apex-language-server-extension-v}"
          VERSION="${VERSION#v}"

          if [ "$DRY_RUN" != 'true' ] && { [ -z "$RELEASE_TAG" ] || [ -n "$VERSION_INPUT" ]; }; then
            echo 'Non-dry-run publishing requires release_tag and derives its version from that tag.'
            exit 1
          fi
          if [ "$DRY_RUN" != 'true' ] && [[ "$RELEASE_TAG" != apex-language-server-extension-v* && "$RELEASE_TAG" != v* ]]; then
            echo "Invalid extension release tag: $RELEASE_TAG"
            exit 1
          fi
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          fi
          if [ -z "$VERSION" ]; then
            echo 'Provide release_tag for a publish/retry, or version for a dry run.'
            exit 1
          fi
          node -e "if (!require('semver').valid(process.argv[1])) process.exit(1)" "$VERSION"

          if [[ "$VERSION" == *-nightly.* ]]; then
            DEFAULT_DIST_TAG=nightly
          else
            DEFAULT_DIST_TAG=latest
          fi
          DIST_TAG="${NPM_DIST_TAG:-$DEFAULT_DIST_TAG}"
          [[ "$DIST_TAG" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "Invalid npm dist-tag: $DIST_TAG"; exit 1; }

          API_TAG="apex-language-server-extension-api-v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "api-tag=$API_TAG" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

          npm pkg set "version=$VERSION" --prefix packages/apex-language-server-extension-api
          npm pkg set 'scripts.build=pnpm --filter @salesforce/apex-language-server-extension-api run compile'

      - name: Build and verify extension API
        run: |
          pnpm --filter "$PACKAGE_NAME" run typecheck
          pnpm --filter "$PACKAGE_NAME" run test
          pnpm --filter "$PACKAGE_NAME" run lint
          pnpm run build

  record:
    needs: prepare
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      API_TAG: ${{ needs.prepare.outputs.api-tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout extension release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Record immutable API release source
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          EXISTING=$(git ls-remote origin "refs/tags/$API_TAG^{}" | awk '{print $1}')
          if [ -n "$EXISTING" ]; then
            git fetch origin "refs/tags/$API_TAG:refs/tags/$API_TAG"
            [ "$(git rev-parse "$API_TAG^")" = "$SOURCE_SHA" ] || { echo "API tag does not descend directly from extension release: $API_TAG"; exit 1; }
            [ "$(git show "$API_TAG:packages/apex-language-server-extension-api/package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')" = "$VERSION" ] || { echo "API tag records a different package version: $API_TAG"; exit 1; }
            echo "Reusing prepared API release tag: $API_TAG"
            git checkout --detach "$API_TAG"
            exit 0
          fi

          npm pkg set "version=$VERSION" --prefix packages/apex-language-server-extension-api
          npm pkg set 'scripts.build=pnpm --filter @salesforce/apex-language-server-extension-api run compile'
          git add packages/apex-language-server-extension-api/package.json package.json
          UNEXPECTED=$(git diff --cached --name-only | grep -Ev '^(package.json|packages/apex-language-server-extension-api/package.json)$' || true)
          [ -z "$UNEXPECTED" ] || { echo "Unexpected staged paths: $UNEXPECTED"; exit 1; }
          TREE=$(git write-tree)
          PREPARED_SHA=$(GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' GIT_COMMITTER_NAME='github-actions[bot]' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' git commit-tree "$TREE" -p "$SOURCE_SHA" -m "chore(api): prepare $VERSION [skip ci]")
          GIT_COMMITTER_NAME='github-actions[bot]' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' git tag --annotate "$API_TAG" "$PREPARED_SHA" --message "API release $VERSION"
          git push origin "refs/tags/$API_TAG"

  publish:
    needs: [prepare, record]
    if: inputs.dry_run != 'true'
    permissions:
      contents: read
      id-token: write
    uses: salesforcecli/github-workflows/.github/workflows/npmPublish.yml@main
    with:
      githubTag: refs/tags/${{ needs.prepare.outputs.api-tag }}
      tag: ${{ needs.prepare.outputs.dist-tag }}
      packageManager: pnpm
      packageManagerVersion: '12.11.2'
      cacheDependencyPath: pnpm-lock.yaml
      nodeVersion: '22.x'
      packagePath: ./packages/apex-language-server-extension-api
      trustedPublishing: true
