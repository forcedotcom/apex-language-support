name: Publish Extension API (Disabled)

# Paired hotfix publication is the only supported API release path.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-release-required:
    runs-on: ubuntu-latest
    steps:
      - name: Reject API-only publication
        run: |
          echo 'Use paired-hotfix-release.yml to publish the host and API from one SHA.'
          exit 1
