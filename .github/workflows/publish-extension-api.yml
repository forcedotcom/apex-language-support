name: Publish Extension API

# Publish the extension API only after its matching VSIX has been published to
# the Marketplace. Callers provide the immutable extension release tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Required for publish/retry. Existing Apex extension release tag; the API version is derived from this tag. Do not set version. Example: apex-language-server-extension-v0.11.70-nightly.20261105'
        required: false
        type: string
      source_ref:
        description: 'Git ref to validate in dry-run mode; defaults to the selected workflow ref'
        required: false
        type: string
      version:
        description: 'Dry-run only. Prospective API version when no release_tag is supplied. Do not set for publish/retry.'
        required: false
        type: string
      npm_dist_tag:
        description: 'npm dist-tag to apply after publishing or verifying the API version'
        required: false
        type: string
      dry_run:
        description: 'Build, test, lint, and pack without publishing to npm'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    env:
      PACKAGE_NAME: '@salesforce/apex-language-server-extension-api'
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_REF: ${{ inputs.source_ref || github.ref }}
      VERSION_INPUT: ${{ inputs.version }}
      NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Checkout extension release tag
        if: env.DRY_RUN != 'true'
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Checkout dry-run source
        if: env.DRY_RUN == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set API version from extension release
        id: release
        run: |
          VERSION="${RELEASE_TAG#apex-language-server-extension-v}"
          VERSION="${VERSION#v}"
          if [ "$DRY_RUN" != 'true' ] && { [ -z "$RELEASE_TAG" ] || [ -n "$VERSION_INPUT" ]; }; then
            echo 'Non-dry-run publishing requires release_tag and derives its version from that tag.'
            exit 1
          fi
          if [ "$DRY_RUN" != 'true' ] && [[ "$RELEASE_TAG" != apex-language-server-extension-v* && "$RELEASE_TAG" != v* ]]; then
            echo "Invalid extension release tag: $RELEASE_TAG"
            exit 1
          fi
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          fi
          if [ -z "$VERSION" ]; then
            echo "Provide release_tag for a publish/retry, or version for a dry run."
            exit 1
          fi
          node -e "if (!require('semver').valid(process.argv[1])) process.exit(1)" "$VERSION"
          npm pkg set "version=$VERSION" --prefix packages/apex-language-server-extension-api
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-nightly.* ]]; then
            DEFAULT_DIST_TAG=nightly
          else
            DEFAULT_DIST_TAG=latest
          fi
          DIST_TAG="${NPM_DIST_TAG:-$DEFAULT_DIST_TAG}"
          [[ "$DIST_TAG" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "Invalid npm dist-tag: $DIST_TAG"; exit 1; }
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and verify extension API
        run: |
          pnpm --filter "$PACKAGE_NAME" run typecheck
          pnpm --filter "$PACKAGE_NAME" run test
          pnpm --filter "$PACKAGE_NAME" run lint

      - name: Pack verified extension API
        run: pnpm --filter "$PACKAGE_NAME" pack --pack-destination /tmp

      - name: Upload verified extension API
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extension-api-package
          path: /tmp/*.tgz
          if-no-files-found: error

  publish:
    needs: validate
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and OIDC-authenticated dist-tag updates
    env:
      PACKAGE_NAME: '@salesforce/apex-language-server-extension-api'
      VERSION: ${{ needs.validate.outputs.version }}
      NPM_DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
    steps:
      # npm 11.21+ supports OIDC-authenticated dist-tag management as well as publishing.
      - name: Setup npm for trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.21.0

      - name: Download verified extension API
        uses: actions/download-artifact@v4
        with:
          name: extension-api-package
          path: /tmp/extension-api-package

      - name: Check whether this API version is already published
        id: published
        run: |
          if npm view "$PACKAGE_NAME@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish extension API
        if: steps.published.outputs.published != 'true'
        run: npm publish /tmp/extension-api-package/*.tgz --access public --tag "$NPM_DIST_TAG" --registry=https://registry.npmjs.org

      - name: Apply npm dist-tag
        run: npm dist-tag add "$PACKAGE_NAME@$VERSION" "$NPM_DIST_TAG" --registry=https://registry.npmjs.org
