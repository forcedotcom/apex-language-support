name: Publish VS Code Marketplace (Trusted) [TEST]
run-name: "VS Code Marketplace OIDC test: ${{ inputs.release-tag }}"

# Dispatch-only, registration/test workflow for VS Code Marketplace OIDC trusted publishing
# (vsce --oidc, shipped by Microsoft 2026-10-28). Exists purely so this file is registered on
# main and can be dispatched by filename -- GitHub won't run a workflow_dispatch workflow by name
# until it exists on the repo's default branch, even when the intent is to run a different
# branch's content via `--ref`.
#
# Confirmed: the Marketplace's OIDC trust check keys off job_workflow_ref, which for a nested
# reusable workflow always points at the other repo (salesforcecli/github-workflows) rather than
# this one -- unlike Open VSX's trusted-publisher match, which keys off workflow_ref and stays the
# same whether nested or not. A --oidc publish step inside a nested reusable *workflow* (the
# original shape of this file, dispatching vscode-publish-release-vsix.yml) 401'd on every attempt
# despite a Trusted Publishing policy registered for this repo + this workflow filename. Validated
# in salesforcedx-vscode (see its identical test workflow) that inlining the publish step directly
# in the caller's own job -- now extracted to salesforcecli/github-workflows's
# vscode/publish-release-vsix composite action (salesforcecli/github-workflows#207), which runs as
# a step rather than a separate job -- fixes it. See W-24756661.
#
# Not wired into any real release channel yet -- that depends on what this test finds.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Nightly git tag to publish from (e.g. apex-language-server-extension-v0.5.3-nightly.20260301)'
        required: true
        type: string
      dry-run:
        description: 'Download and inspect VSIXs without publishing'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # TEMPORARY: pinned to the github-workflows PR branch adding this action
      # (salesforcecli/github-workflows#207), to validate end-to-end before that PR merges.
      - uses: salesforcecli/github-workflows/.github/actions/vscode/publish-release-vsix@ms/W-24756661-vsce-oidc-composite-action
        with:
          release-tag: ${{ inputs.release-tag }}
          vsix-name-pattern: 'apex-language-server-extension-*.vsix'
          exclude-web-vsix: 'true'
          dry-run: ${{ inputs.dry-run || false }}
