name: Publish VS Code Marketplace (Trusted)
run-name: "VS Code Marketplace: ${{ inputs.release-tag }}"

# The actual `vsce publish --oidc` for the version-tag path lives here. The Marketplace's
# trusted-publisher match keys off the OIDC token's job_workflow_ref claim, which only matches
# the calling repo's own workflow filename when the publish step runs inline as a step inside
# the caller's own job (a composite action), not as a separate job via a nested cross-repo
# reusable workflow `uses:` call. So manual-publish.yml dispatches this file via
# `gh workflow run` (a new, independent run, not a `uses:` call) instead of publishing the
# Marketplace itself, giving the publish a job_workflow_ref that matches *this* file. Register
# the Marketplace trusted publisher against this file.
#
# source-run-id has no GitHub Release for this tag-based publish to target, so manual-publish.yml
# only dispatches this file on the version-tag path -- same constraint as
# publishOpenVSXTrusted.yml.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag to publish (e.g. apex-language-server-extension-v0.5.3-nightly.20260301 or apex-language-server-extension-v0.6.0)'
        required: true
        type: string
      dry-run:
        description: 'Download and inspect VSIXs without publishing'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # vsce exchanges this job's OIDC token for a Marketplace publishing token
    steps:
      - uses: salesforcecli/github-workflows/.github/actions/vscode/publish-release-vsix@main
        with:
          release-tag: ${{ inputs.release-tag }}
          vsix-name-pattern: 'apex-language-server-extension-*.vsix'
          exclude-web-vsix: 'true'
          dry-run: ${{ inputs.dry-run || false }}
