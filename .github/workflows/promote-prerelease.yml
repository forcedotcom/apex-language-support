name: Promote Nightly to Pre-release

on:
  schedule:
    # Wednesdays at 7 AM UTC
    - cron: '0 7 * * 3'
  workflow_dispatch:
    inputs:
      min-tag-age-days:
        description: 'Minimum nightly age in days before eligible for promotion (default: 7)'
        required: false
        default: '7'
        type: string
      dry-run:
        description: 'Run in dry-run mode (no actual publishing or tagging)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  # Step 1: Find nightly candidate (THIS REPO CONTROLS CRITERIA)
  find-nightly:
    uses: salesforcecli/github-workflows/.github/workflows/vscode-find-nightly-candidate.yml@main
    with:
      min-tag-age-days: ${{ inputs.min-tag-age-days || '7' }}

  # Step 2: Gate-check CI status (THIS REPO CONTROLS CRITERIA)
  gate-check:
    needs: find-nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CI status
        uses: salesforcecli/github-workflows/.github/actions/vscode/check-ci-status@main
        with:
          commit-sha: ${{ needs.find-nightly.outputs.commit-sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          required-checks: '["CI Complete"]'

  # Step 3: Promote to marketplace (only runs if gate-check passed). vsce only -- Open VSX is
  # published separately below (trigger-openvsx-publish), see that job's comment for why.
  promote:
    needs: [find-nightly, gate-check]
    uses: salesforcecli/github-workflows/.github/workflows/vscode-promote-prerelease.yml@main
    with:
      release-tag: ${{ needs.find-nightly.outputs.nightly-tag }}
      vsix-name-pattern: 'apex-language-server-extension-*.vsix'
      exclude-web-vsix: 'true'
      extension-name: 'apex-lsp-vscode-extension'
      dry-run: ${{ inputs.dry-run || 'false' }}
    secrets: inherit

  # Step 4: Dispatch publishOpenVSXTrusted.yml for this exact nightly -- see its header for why
  # Open VSX publishing lives there instead of in vscode-promote-prerelease.yml.
  trigger-openvsx-publish:
    needs: [find-nightly, promote]
    if: always() && needs.promote.result == 'success' && inputs.dry-run != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
      NIGHTLY_TAG: ${{ needs.find-nightly.outputs.nightly-tag }}
    steps:
      - name: Dispatch Open VSX publish for this nightly
        run: |
          gh workflow run publishOpenVSXTrusted.yml \
            --repo "${{ github.repository }}" \
            -f release-tag="$NIGHTLY_TAG"

  promote-extension-api:
    needs: [find-nightly, promote]
    if: needs.promote.result == 'success' && (inputs.dry-run || 'false') != 'true'
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: '@salesforce/apex-language-server-extension-api'
      RELEASE_TAG: ${{ needs.find-nightly.outputs.nightly-tag }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Promote matching nightly API to npm pre-release
        run: |
          VERSION="${RELEASE_TAG#apex-language-server-extension-v}"
          VERSION="${VERSION#v}"
          node -e "if (!/^(0|[1-9]\\d*)\.(0|[1-9]\\d*)\.(0|[1-9]\\d*)(-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(process.argv[1])) process.exit(1)" "$VERSION"
          npm view "$PACKAGE_NAME@$VERSION" version --registry=https://registry.npmjs.org >/dev/null
          npm dist-tag add "$PACKAGE_NAME@$VERSION" pre-release --registry=https://registry.npmjs.org
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
