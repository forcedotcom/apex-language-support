name: Manual Publish

# Publish a VS Code extension to the marketplace from either:
#   - A nightly GitHub Release (version-tag path — normal workflow)
#   - A branch CI build artifact (source-run-id path — out-of-band, bypass mandatory)
#
# Exactly one of version-tag or source-run-id must be provided.
#
# Open VSX is published separately by trigger-openvsx-publish below, not by vscode-manual-publish.yml
# -- see publishOpenVSXTrusted.yml's header for why.
#
# The VS Code Marketplace is published separately by trigger-vscode-marketplace-publish below,
# not by vscode-manual-publish.yml -- see publishVSCodeMarketplaceTrusted.yml's header for why.

on:
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension to publish'
        required: true
        default: 'apex-lsp-vscode-extension'
        type: choice
        options:
          - apex-lsp-vscode-extension
      version-tag:
        description: >
          [Tag path] Nightly git tag to publish from
          (e.g. apex-language-server-extension-v0.5.3-nightly.20260301).
          Mutually exclusive with source-run-id.
        required: false
        default: ''
        type: string
      source-run-id:
        description: >
          [Run path] GitHub Actions run ID whose VSIX artifact to publish
          (e.g. 12345678). Use for branch builds that don't produce a GH release.
          Mutually exclusive with version-tag.
          IMPORTANT: skip-quality-checks must be true and confirm-bypass must be BYPASS.
        required: false
        default: ''
        type: string
      slot:
        description: 'Marketplace slot to publish to (pre-release or stable)'
        required: true
        default: 'pre-release'
        type: choice
        options:
          - pre-release
          - stable
      registries:
        description: 'Registries to publish to'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - vsce
          - ovsx
          - none
      publish-web-vsix:
        description: 'Publish the web VSIX to the CBWeb internal marketplace (pre-release only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target-stable-version:
        description: >
          Optional stable version override (e.g. 0.6.1 for a stable patch).
          Must be valid semver with an EVEN minor. If omitted, auto-computed via
          semver minor bump (e.g. 0.5.3 → 0.6.0). Only applies when slot is stable.
          Required when using source-run-id with slot stable.
        required: false
        default: ''
        type: string
      publish-extension-api:
        description: 'Coordinate the matching extension API npm package: auto promotes tag-based pre-releases and follows stable release creation; required rejects source-run-id; skip publishes only the VSIX'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - required
          - skip
      skip-quality-checks:
        description: 'Skip CI quality gate. REQUIRED when using source-run-id.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      confirm-bypass:
        description: 'Type BYPASS to confirm skipping CI quality gate (required when skip-quality-checks is true)'
        required: false
        default: ''
        type: string
      dry-run:
        description: 'Run in dry-run mode (no actual publishing or tagging)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  manual-publish:
    uses: salesforcecli/github-workflows/.github/workflows/vscode-manual-publish.yml@main
    with:
      extension-name: ${{ inputs.extension }}
      vsix-name-pattern: 'apex-language-server-extension-*.vsix'
      version-tag: ${{ inputs.version-tag }}
      source-run-id: ${{ inputs.source-run-id }}
      slot: ${{ inputs.slot }}
      registries: ${{ inputs.registries }}
      publish-web-vsix: ${{ inputs.publish-web-vsix }}
      target-stable-version: ${{ inputs.target-stable-version }}
      skip-quality-checks: ${{ inputs.skip-quality-checks }}
      confirm-bypass: ${{ inputs.confirm-bypass }}
      exclude-web-vsix: 'true'
      extensions-root: 'packages'
      vsix-artifact-name: 'vsix-packages'
      required-ci-checks: '["CI Complete","Package / Package","Test Quality (ubuntu-latest, lts/*)"]'
      package-manager: 'pnpm'
      package-manager-version: '12.11.2'
      cache-dependency-path: 'pnpm-lock.yaml'
      lockfile-path: 'pnpm-lock.yaml'
      install-command: 'pnpm install --frozen-lockfile'
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  # Only applies to the version-tag path: source-run-id has no GitHub Release for a tag-based
  # publish to target, and vscode-manual-publish.yml's input validation hard-errors that
  # combination rather than silently skipping it.
  trigger-openvsx-publish:
    needs: manual-publish
    if: always() && needs.manual-publish.result == 'success' && inputs.version-tag != '' && (inputs.registries == 'ovsx' || inputs.registries == 'all') && inputs.dry-run != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
      VERSION_TAG: ${{ inputs.version-tag }}
    steps:
      - name: Dispatch Open VSX publish for this version tag
        run: |
          gh workflow run publishOpenVSXTrusted.yml \
            --repo "${{ github.repository }}" \
            -f release-tag="$VERSION_TAG"

  # Only applies to the version-tag path: source-run-id has no GitHub Release for a tag-based
  # publish to target, same constraint as trigger-openvsx-publish above.
  trigger-vscode-marketplace-publish:
    needs: manual-publish
    if: always() && needs.manual-publish.result == 'success' && inputs.version-tag != '' && (inputs.registries == 'vsce' || inputs.registries == 'all') && inputs.dry-run != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
      VERSION_TAG: ${{ inputs.version-tag }}
    steps:
      - name: Dispatch VS Code Marketplace publish for this version tag
        run: |
          gh workflow run publishVSCodeMarketplaceTrusted.yml \
            --repo "${{ github.repository }}" \
            -f release-tag="$VERSION_TAG"

  coordinate-extension-api:
    needs: manual-publish
    if: always() && needs.manual-publish.result == 'success' && inputs.publish-extension-api != 'skip' && inputs.dry-run != 'true'
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: '@salesforce/apex-language-server-extension-api'
      VERSION_TAG: ${{ inputs.version-tag }}
      SOURCE_RUN_ID: ${{ inputs.source-run-id }}
      SLOT: ${{ inputs.slot }}
      PUBLISH_MODE: ${{ inputs.publish-extension-api }}
    steps:
      - name: Reject unverifiable required API publish
        if: env.SOURCE_RUN_ID != '' && env.PUBLISH_MODE == 'required'
        run: |
          echo "A source-run-id identifies a VSIX artifact, not an immutable extension release tag."
          echo "Use a version-tag source to coordinate the extension API package."
          exit 1

      - name: Skip API coordination for a source-run artifact
        if: env.SOURCE_RUN_ID != '' && env.PUBLISH_MODE == 'auto'
        run: |
          echo "Skipping API coordination: source-run-id has no immutable extension release tag."

      - name: Setup Node.js
        if: env.VERSION_TAG != '' && env.SLOT == 'pre-release'
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Promote matching nightly API to npm pre-release
        if: env.VERSION_TAG != '' && env.SLOT == 'pre-release'
        run: |
          VERSION="${VERSION_TAG#apex-language-server-extension-v}"
          VERSION="${VERSION#v}"
          node -e "if (!/^(0|[1-9]\\d*)\.(0|[1-9]\\d*)\.(0|[1-9]\\d*)(-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(process.argv[1])) process.exit(1)" "$VERSION"
          npm view "$PACKAGE_NAME@$VERSION" version --registry=https://registry.npmjs.org >/dev/null
          npm dist-tag add "$PACKAGE_NAME@$VERSION" pre-release --registry=https://registry.npmjs.org
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm stable API publication trigger
        if: env.VERSION_TAG != '' && env.SLOT == 'stable'
        run: |
          echo "Manual Publish created a stable extension GitHub Release."
          echo "That release triggers Publish Extension API to publish the matching stable API package under npm latest."
